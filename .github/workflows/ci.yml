name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_password' }}
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://teamflow:${{ secrets.CI_DB_PASSWORD || 'ci_only_password' }}@localhost:5432/teamflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: Применить миграции к чистой БД
        run: node packages/dal/dist/migrate.js
